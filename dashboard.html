<!-- APP -->
<div

<script>


/* =========================================================
   CONFIG
========================================================= */

const WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbzcelyMSU0DWJjJcvc8vWjixJU7qjX3UXSOrZg-L9nIRNrymhpl7N8KisRQzaZzDZFe7g/exec";


let allTransactions = [];

let categoryChart;

let typeChart;



/* =========================================================
   AMOUNT FUNCTIONS
========================================================= */

function parseAmount(value) {

  if (!value) {
    return 0;
  }


  return (
    Number(
      String(value)
        .replace(/,/g, "")
    )
    ||
    0
  );

}



function formatRM(value) {

  return (
    "RM "
    +
    value.toLocaleString(
      "en-MY",
      {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }
    )
  );

}



/* =========================================================
   TRANSACTION DATE MONTH
   Fallback for old transactions only
========================================================= */

function getTransactionMonthKey(
  dateValue
) {

  if (!dateValue) {
    return "";
  }


  /*
  If date comes as:
  2026-09-28

  return:
  2026-09

  This avoids timezone problems.
  */

  const dateString =
    String(dateValue);


  const match =
    dateString.match(
      /^(\d{4})-(\d{2})/
    );


  if (match) {

    return (
      match[1]
      +
      "-"
      +
      match[2]
    );

  }


  const date =
    new Date(dateValue);


  if (
    isNaN(
      date.getTime()
    )
  ) {

    return "";

  }


  return (
    date.getFullYear()
    +
    "-"
    +
    String(
      date.getMonth() + 1
    ).padStart(2, "0")
  );

}



/* =========================================================
   BILLING MONTH NORMALIZER
========================================================= */

/*
Supports:

2026-10
October 2026
October

New entries should ideally use:
2026-10
*/

function normalizeBillingMonth(
  value,
  transactionDate
) {

  if (!value) {

    return getTransactionMonthKey(
      transactionDate
    );

  }


  const stringValue =
    String(value)
      .trim();


  /*
  Already correct:
  2026-10
  */

  if (
    /^\d{4}-\d{2}$/
      .test(stringValue)
  ) {

    return stringValue;

  }



  const monthNumbers = {

    january: "01",
    february: "02",
    march: "03",
    april: "04",
    may: "05",
    june: "06",
    july: "07",
    august: "08",
    september: "09",
    october: "10",
    november: "11",
    december: "12"

  };


  /*
  Example:
  October
  October 2026
  */

  const match =
    stringValue.match(
      /^([A-Za-z]+)(?:\s+(\d{4}))?$/
    );


  if (match) {

    const monthName =
      match[1]
        .toLowerCase();


    const monthNumber =
      monthNumbers[
        monthName
      ];


    if (monthNumber) {


      let year =
        match[2];


      /*
      Old value only says:
      October

      Use transaction year.
      */

      if (!year) {

        year =
          getTransactionMonthKey(
            transactionDate
          )
          .slice(
            0,
            4
          );

      }


      if (year) {

        return (
          year
          +
          "-"
          +
          monthNumber
        );

      }

    }

  }


  /*
  Last fallback:
  transaction month
  */

  return getTransactionMonthKey(
    transactionDate
  );

}



/* =========================================================
   GET BILLING MONTH FOR A ROW
========================================================= */

function getBillingMonthKey(row) {

  /*
  New tracker / new API
  */

  if (
    row.billingMonth
  ) {

    return normalizeBillingMonth(

      row.billingMonth,

      row.date

    );

  }


  /*
  Existing Google Sheet / old API
  where Column C may come back as "month"
  */

  if (
    row.month
  ) {

    return normalizeBillingMonth(

      row.month,

      row.date

    );

  }


  /*
  Legacy transaction:
  no billing month available.

  Fall back to actual date.
  */

  return getTransactionMonthKey(
    row.date
  );

}



/* =========================================================
   MONTH LABEL
========================================================= */

function getMonthLabel(
  monthKey
) {

  if (!monthKey) {
    return "";
  }


  const parts =
    monthKey
      .split("-");


  const year =
    Number(
      parts[0]
    );


  const month =
    Number(
      parts[1]
    )
    -
    1;


  if (
    !year
    ||
    month < 0
    ||
    month > 11
  ) {

    return monthKey;

  }


  return new Date(
    year,
    month,
    1
  )
  .toLocaleDateString(
    "en-GB",
    {

      month: "long",

      year: "numeric"

    }
  );

}



/* =========================================================
   LOAD DASHBOARD DATA
========================================================= */

async function loadDashboardData() {


  document
    .getElementById(
      "loadingBox"
    )
    .style.display =
    "block";


  try {


    const response =
      await fetch(

        WEB_APP_URL
        +
        "?limit=5000&t="
        +
        Date.now()

      );


    const data =
      await response.json();


    allTransactions =
      Array.isArray(data)
        ? data
        : [];


    populateMonthFilter();


    renderDashboard();


    document
      .getElementById(
        "loadingBox"
      )
      .style.display =
      "none";


  } catch (error) {


    document
      .getElementById(
        "loadingBox"
      )
      .className =
      "alert alert-danger";


    document
      .getElementById(
        "loadingBox"
      )
      .innerText =
      "Unable to load dashboard data.";


  }

}



/* =========================================================
   POPULATE BILLING MONTH FILTER
========================================================= */

function populateMonthFilter() {


  const monthFilter =
    document.getElementById(
      "monthFilter"
    );


  /*
  IMPORTANT:

  Uses Billing Month,
  NOT transaction date.
  */

  const months =
    [
      ...new Set(

        allTransactions

          .map(
            row =>
              getBillingMonthKey(
                row
              )
          )

          .filter(Boolean)

      )
    ]
    .sort()
    .reverse();



  monthFilter.innerHTML =
    `
      <option value="all">
        All Billing Months
      </option>
    `;



  months.forEach(
    month => {


      monthFilter.innerHTML +=
        `
          <option value="${month}">
            ${getMonthLabel(month)}
          </option>
        `;


    }
  );

}



/* =========================================================
   FILTER DATA BY BILLING MONTH
========================================================= */

function getFilteredData() {


  const selectedMonth =
    document
      .getElementById(
        "monthFilter"
      )
      .value;



  if (
    selectedMonth ===
    "all"
  ) {

    return allTransactions;

  }



  /*
  IMPORTANT:

  Billing Month determines
  which dashboard month
  transaction belongs to.
  */

  return allTransactions.filter(

    row =>

      getBillingMonthKey(
        row
      )
      ===
      selectedMonth

  );

}



/* =========================================================
   RENDER DASHBOARD
========================================================= */

function renderDashboard() {


  const data =
    getFilteredData();


  let income = 0;

  let expense = 0;

  let transfer = 0;

  let deduction = 0;



  const categoryTotals = {};


  const typeTotals = {

    Income: 0,

    Expense: 0,

    Transfer: 0,

    Deduction: 0

  };



  data.forEach(
    row => {


      const amount =
        parseAmount(
          row.amount
        );


      const type =
        row.type
        ||
        "Others";


      const category =
        row.category
        ||
        "Others";



      if (
        type ===
        "Income"
      ) {

        income +=
          amount;

      }



      if (
        type ===
        "Expense"
      ) {

        expense +=
          amount;

      }



      if (
        type ===
        "Transfer"
      ) {

        transfer +=
          amount;

      }



      if (
        type ===
        "Deduction"
      ) {

        deduction +=
          amount;

      }



      if (
        !typeTotals[type]
      ) {

        typeTotals[type] =
          0;

      }


      typeTotals[type] +=
        amount;



      /*
      Category spending includes:

      Expense
      Deduction
      */

      if (
        type === "Expense"
        ||
        type === "Deduction"
      ) {


        if (
          !categoryTotals[
            category
          ]
        ) {

          categoryTotals[
            category
          ] =
            0;

        }


        categoryTotals[
          category
        ]
        +=
        amount;


      }


    }
  );



  /*
  Your existing balance logic:

  Income
  - Expense
  - Transfer
  - Deduction
  */

  const balance =

    income

    -

    expense

    -

    transfer

    -

    deduction;



  document
    .getElementById(
      "incomeKpi"
    )
    .innerText =
    formatRM(
      income
    );


  document
    .getElementById(
      "expenseKpi"
    )
    .innerText =
    formatRM(
      expense
    );


  document
    .getElementById(
      "transferKpi"
    )
    .innerText =
    formatRM(
      transfer
    );


  document
    .getElementById(
      "balanceKpi"
    )
    .innerText =
    formatRM(
      balance
    );



  document
    .getElementById(
      "balanceKpi"
    )
    .className =

    balance >= 0

      ? "kpi-value amount-positive"

      : "kpi-value amount-negative";



  renderCategoryTable(
    categoryTotals
  );


  renderCategoryChart(
    categoryTotals
  );


  renderTypeChart(
    typeTotals
  );

}



/* =========================================================
   CATEGORY TABLE
========================================================= */

function renderCategoryTable(
  categoryTotals
) {


  const table =
    document.getElementById(
      "categoryTable"
    );


  const sorted =
    Object
      .entries(
        categoryTotals
      )
      .sort(
        (a, b) =>
          b[1] - a[1]
      );



  if (
    sorted.length === 0
  ) {


    table.innerHTML =
      `
        <tr>
          <td colspan="2">
            No spending data
          </td>
        </tr>
      `;


    return;

  }



  table.innerHTML =
    "";



  sorted.forEach(
    (
      [
        category,
        amount
      ]
    ) => {


      table.innerHTML +=
        `
          <tr>

            <td>
              ${category}
            </td>

            <td class="text-end fw-bold">
              ${formatRM(amount)}
            </td>

          </tr>
        `;


    }
  );

}



/* =========================================================
   CATEGORY CHART
========================================================= */

function renderCategoryChart(
  categoryTotals
) {


  const labels =
    Object.keys(
      categoryTotals
    );


  const values =
    Object.values(
      categoryTotals
    );



  if (
    categoryChart
  ) {

    categoryChart.destroy();

  }



  const ctx =
    document.getElementById(
      "categoryChart"
    );



  categoryChart =
    new Chart(
      ctx,
      {

        type:
          "doughnut",


        data: {

          labels:
            labels,


          datasets: [
            {

              data:
                values

            }
          ]

        },


        options: {

          responsive:
            true,


          plugins: {

            legend: {

              position:
                "bottom"

            }

          }

        }

      }
    );

}



/* =========================================================
   TYPE CHART
========================================================= */

function renderTypeChart(
  typeTotals
) {


  const labels =
    Object.keys(
      typeTotals
    );


  const values =
    Object.values(
      typeTotals
    );



  if (
    typeChart
  ) {

    typeChart.destroy();

  }



  const ctx =
    document.getElementById(
      "typeChart"
    );



  typeChart =
    new Chart(
      ctx,
      {

        type:
          "bar",


        data: {

          labels:
            labels,


          datasets: [
            {

              label:
                "Amount",

              data:
                values

            }
          ]

        },


        options: {

          responsive:
            true,


          plugins: {

            legend: {

              display:
                false

            }

          },


          scales: {

            y: {

              beginAtZero:
                true

            }

          }

        }

      }
    );

}



/* =========================================================
   MONTH FILTER CHANGE
========================================================= */

document
  .getElementById(
    "monthFilter"
  )
  .addEventListener(
    "change",
    renderDashboard
  );


</script>
