<script>

let dateSortDesc = true;

let currentData = [];

const WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbzcelyMSU0DWJjJcvc8vWjixJU7qjX3UXSOrZg-L9nIRNrymhpl7N8KisRQzaZzDZFe7g/exec";

let currentLimit = 20;

let editModal;

let refreshTimer = null;


/* =========================================================
   DEFAULT DATE
========================================================= */

document.getElementById("date").valueAsDate =
  new Date();



/* =========================================================
   BILLING MONTH
========================================================= */

/*
Example stored value:

2026-10

Desktop display:
October 2026

Mobile display:
Oct26
*/


function monthKey(date) {

  return (
    date.getFullYear()
    + "-"
    + String(
        date.getMonth() + 1
      ).padStart(2, "0")
  );

}


function monthLabel(date) {

  return date.toLocaleDateString(
    "en-GB",
    {
      month: "long",
      year: "numeric"
    }
  );

}


function populateMonthSelect(
  select,
  selectedValue,
  referenceDate
) {

  const reference =
    referenceDate || new Date();

  const chosen =
    selectedValue || monthKey(new Date());


  select.innerHTML = "";


  /*
  Show 12 months before
  and 12 months after.
  */

  for (
    let offset = -12;
    offset <= 12;
    offset++
  ) {

    const date =
      new Date(
        reference.getFullYear(),
        reference.getMonth() + offset,
        1
      );


    select.add(
      new Option(
        monthLabel(date),
        monthKey(date)
      )
    );

  }


  /*
  Add saved month if it falls
  outside the current range.
  */

  const exists =
    [...select.options]
      .some(
        option =>
          option.value === chosen
      );


  if (!exists) {

    const parts =
      chosen
        .split("-")
        .map(Number);


    const year =
      parts[0];


    const month =
      parts[1];


    if (
      year &&
      month >= 1 &&
      month <= 12
    ) {

      select.add(
        new Option(
          monthLabel(
            new Date(
              year,
              month - 1,
              1
            )
          ),
          chosen
        )
      );

    }

  }


  select.value =
    chosen;

}



/*
New transaction always defaults
to CURRENT calendar month.

Changing transaction date does NOT
automatically change Billing Month.
*/

function resetBillingMonth() {

  populateMonthSelect(
    document.getElementById(
      "billingMonth"
    ),
    monthKey(new Date()),
    new Date()
  );

}



/*
Supports existing spreadsheet values.

Examples:

October
October 2026
2026-10
*/

function normalizeSavedMonth(
  value,
  transactionDate
) {

  if (
    typeof value === "string"
    &&
    /^\d{4}-\d{2}$/.test(value)
  ) {

    return value;

  }


  const monthNames = [

    "january",
    "february",
    "march",
    "april",
    "may",
    "june",
    "july",
    "august",
    "september",
    "october",
    "november",
    "december"

  ];


  const match =
    String(value || "")
      .trim()
      .match(
        /^([a-z]+)(?:\s+(\d{4}))?$/i
      );


  if (match) {

    const month =
      monthNames.indexOf(
        match[1].toLowerCase()
      );


    if (month !== -1) {

      const year =
        Number(match[2])
        ||
        Number(
          String(
            transactionDate || ""
          ).slice(0, 4)
        )
        ||
        new Date().getFullYear();


      return monthKey(
        new Date(
          year,
          month,
          1
        )
      );

    }

  }


  /*
  If Billing Month is missing,
  use transaction month.
  */

  const transactionString =
    String(
      transactionDate || ""
    );


  if (
    /^\d{4}-\d{2}/
      .test(transactionString)
  ) {

    return transactionString.slice(
      0,
      7
    );

  }


  return monthKey(
    new Date()
  );

}



/*
Desktop:
October 2026

Mobile:
Oct26
*/

function displayBillingMonth(
  value,
  transactionDate,
  isMobile = false
) {

  const normalized =
    normalizeSavedMonth(
      value,
      transactionDate
    );


  const parts =
    normalized
      .split("-")
      .map(Number);


  const year =
    parts[0];


  const month =
    parts[1];


  const date =
    new Date(
      year,
      month - 1,
      1
    );


  if (isMobile) {

    const shortMonth =
      date.toLocaleDateString(
        "en-GB",
        {
          month: "short"
        }
      );


    const shortYear =
      String(year)
        .slice(-2);


    return (
      shortMonth
      +
      shortYear
    );

  }


  return date.toLocaleDateString(
    "en-GB",
    {
      month: "long",
      year: "numeric"
    }
  );

}



/* =========================================================
   MOBILE HEADERS
========================================================= */

function updateResponsiveLabels() {

  const isMobile =
    window.innerWidth < 768;


  document

/* =========================================================
   INITIAL BILLING MONTH
========================================================= */

resetBillingMonth();



/* =========================================================

========================================================= */

document.addEventListener(
  "DOMContentLoaded",

/* =========================================================
   CREATE TRANSACTION
========================================================= */

document
  .getElementById(
    "expenseForm"
  )
  .addEventListener(
    "submit",
    async function(e) {

      e.preventDefault();


      const payload = {

        action: "create",

        date:
          document
            .getElementById(
              "date"
            )
            .value,

        billingMonth:
          document
            .getElementById(
              "billingMonth"
            )
            .value,

        type:
          document
            .getElementById(
              "type"
            )
            .value,

        category:
          document
            .getElementById(
              "category"
            )
            .value,

        subCategory:
          document
            .getElementById(
              "subCategory"
            )
            .value,

        amount:
          document
            .getElementById(
              "amount"
            )
            .value,

        notes:
          document
            .getElementById(
              "notes"
            )
            .value

      };


      document
        .getElementById(
          "status"
        )
        .innerText =
        "Saving...";


      try {

        await fetch(
          WEB_APP_URL,
          {

            method: "POST",

            mode: "no-cors",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body:
              JSON.stringify(
                payload
              )

          }
        );


        document
          .getElementById(
            "status"
          )
          .innerText =
          "✅ Saved successfully.";


        document
          .getElementById(
            "expenseForm"
          )
          .reset();


        document
          .getElementById(
            "date"
          )
          .valueAsDate =
          new Date();


        /*
        Billing Month resets
        to current month.
        */

        resetBillingMonth();


        currentLimit = 20;


        setTimeout(
          loadRecentInputs,
          1500
        );


      } catch (error) {


        document
          .getElementById(
            "status"
          )
          .innerText =
          "❌ Error saving entry.";


      }

    }
  );



/* =========================================================
   LOAD MORE
========================================================= */

document
  .getElementById(
    "loadMoreBtn"
  )
  .addEventListener(
    "click",
    function() {

      currentLimit += 20;

      loadRecentInputs();

    }
  );



/* =========================================================
   LOAD RECENT TRANSACTIONS
========================================================= */

async function loadRecentInputs() {

  const table =
    document.getElementById(
      "recentTable"
    );


  try {

    const response =
      await fetch(

        WEB_APP_URL
        + "?limit="
        + currentLimit
        + "&t="
        + Date.now()

      );


    const data =
      await response.json();


    currentData =
      data;


    sortCurrentData();


    table.innerHTML =
      "";


    if (
      !Array.isArray(data)
      ||
      data.length === 0
    ) {

      table.innerHTML =
        "<tr><td colspan='7'>No recent transactions found.</td></tr>";

      return;

    }


    currentData.forEach(
      row => {


        const tr =
          document.createElement(
            "tr"
          );


        tr.className =
          "transaction-row";


        const isMobile =
          window.innerWidth < 768;


        const displayDate =
          isMobile
            ? formatShortDate(
                row.date
              )
            : row.date;


        const displayType =
          isMobile
            ? shortType(
                row.type
              )
            : row.type;


        const displayCategory =
          isMobile
            ? shortCategory(
                row.category
              )
            : row.category;


        const displayAmount =
          isMobile
            ? row.amount
            : `RM ${row.amount}`;


        const billingMonthDisplay =
          displayBillingMonth(

            row.billingMonth
            ||
            row.month,

            row.date,

            isMobile

          );


        tr.innerHTML = `

          <td>
            ${displayDate || ""}
          </td>

          <td>
            ${billingMonthDisplay || ""}
          </td>

          <td>
            ${displayType || ""}
          </td>

          <td>
            ${displayCategory || ""}
          </td>

          <td>
            ${row.subCategory || ""}
          </td>

          <td class="amount">
            ${displayAmount || ""}
          </td>

          <td>
            ${row.notes || ""}
          </td>

        `;


        tr.addEventListener(
          "click",
          function() {

            openEditModal(
              row
            );

          }
        );


        table.appendChild(
          tr
        );

      }
    );


    document
      .getElementById(
        "loadMoreBtn"
      )
      .style.display =

        data.length
        <
        currentLimit

          ? "none"
          : "block";


  } catch (error) {


    table.innerHTML =
      "<tr><td colspan='7'>Unable to load recent transactions.</td></tr>";


  }

}



/* =========================================================
   SORT TRANSACTIONS
========================================================= */

function sortCurrentData() {

  currentData.sort(
    (a, b) => {

      return dateSortDesc

        ? new Date(b.date)
          -
          new Date(a.date)

        : new Date(a.date)
          -
          new Date(b.date);

    }
  );

}



document
  .getElementById(
    "dateHeader"
  )
  .addEventListener(
    "click",
    function() {


      dateSortDesc =
        !dateSortDesc;


      this.innerHTML =
        dateSortDesc
          ? "Date ↓"
          : "Date ↑";


      loadRecentInputs();


    }
  );



/* =========================================================
   OPEN EDIT MODAL
========================================================= */

function openEditModal(row) {


  document
    .getElementById(
      "editId"
    )
    .value =
    row.id || "";


  document
    .getElementById(
      "editDate"
    )
    .value =
    row.date || "";


  /*
  Billing Month
  */

  const savedMonth =
    normalizeSavedMonth(

      row.billingMonth
      ||
      row.month,

      row.date

    );


  const parts =
    savedMonth
      .split("-")
      .map(Number);


  const savedYear =
    parts[0];


  const savedMonthNumber =
    parts[1];


  populateMonthSelect(

    document.getElementById(
      "editBillingMonth"
    ),

    savedMonth,

    new Date(
      savedYear,
      savedMonthNumber - 1,
      1
    )

  );


  document

function formatShortDate(
  dateValue
) {

  if (!dateValue) {
    return "";
  }


  return new Date(
    dateValue
  ).toLocaleDateString(

    "en-GB",

    {
      day: "2-digit",
      month: "short"
    }

  );

}



function shortType(type) {

  return {

    Expense:
      "Exp",

    Income:
